[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Routing
#
# Every page is prerendered to a physical file (dist/spa/<route>/index.html)
# by vite-react-ssg, so there is deliberately NO blanket "/* → /index.html 200"
# SPA fallback: unknown URLs fall through to dist/spa/404.html, which Netlify
# serves with a real 404 status.
#
# Trailing slashes: Netlify's built-in Pretty URLs (on by default) 301s
# "/slingshot-rental" → "/slingshot-rental/" and "/x/index.html" → "/x/" for
# every directory index. Do NOT add redirect rules for this — Netlify
# normalizes trailing slashes before matching, so "/x → /x/" rules loop
# (https://docs.netlify.com/manage/routing/redirects/redirect-options/).
# ---------------------------------------------------------------------------

# API → serverless function (unchanged)
[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

# www → apex (canonical host is https://ennisslingshot.com)
[[redirects]]
from = "https://www.ennisslingshot.com/*"
to = "https://ennisslingshot.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.ennisslingshot.com/*"
to = "https://ennisslingshot.com/:splat"
status = 301
force = true

# Legacy blog URLs without trailing slash are handled by Pretty URLs; keep the
# old un-slashed home aliases pointing at the canonical paths.
[[redirects]]
from = "/index.html"
to = "/"
status = 301

# ---------------------------------------------------------------------------
# Security headers + CSP (SITE-REBUILD-PLAN.md §3)
# ---------------------------------------------------------------------------
[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://app.acuityscheduling.com\" \"https://embed.acuityscheduling.com\")"
  Content-Security-Policy = """
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'self';
    upgrade-insecure-requests;
    script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://embed.acuityscheduling.com https://app.acuityscheduling.com https://www.youtube.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https://cdn.builder.io https://images.pexels.com https://*.tile.openstreetmap.org https://www.facebook.com https://facebook.com https://i0.wp.com https://*.wp.com https://blog.nxtmt.ventures https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://i.ytimg.com;
    media-src 'self' blob: https://videos.files.wordpress.com https://*.wordpress.com;
    frame-src 'self' https://app.acuityscheduling.com https://embed.acuityscheduling.com https://*.acuityscheduling.com https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://td.doubleclick.net;
    connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://connect.facebook.net https://www.facebook.com https://api.open-meteo.com https://*.acuityscheduling.com https://cdn.builder.io;
    form-action 'self' https://*.acuityscheduling.com;
    """

# Long-lived caching for hashed build assets
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Prebuilt blog hero images (scripts/fetch-blog-images.mjs) — keyed by WP post id, refetched per build
[[headers]]
for = "/blog-images/*"
  [headers.values]
  Cache-Control = "public, max-age=604800"

# Generated machine-readable files: short cache so updates propagate
[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/rss.xml"
  [headers.values]
  Cache-Control = "public, max-age=3600"
  Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
for = "/llms.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
